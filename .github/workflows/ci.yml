# The merge gate: every job here must pass before a pull request lands on main.
# Run the same checks locally before pushing (see scripts/).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_repo.py
      - run: python3 scripts/check_boundaries.py
      - name: Check the generated Android tokens
        run: node design/tokens/build-kotlin.mjs --check
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 scripts/check_commits.py "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

  kotlin-style:
    name: Kotlin style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: scripts/ktlint.sh

  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Point cargo-ndk at the runner's NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, unit test and build APK
        working-directory: android
        run: ./gradlew --no-daemon lintRelease testReleaseUnitTest assembleRelease
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: grapho-android
          path: android/app/build/outputs/apk/release/*.apk
