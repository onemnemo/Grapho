# Signed release builds. Runs on a version tag (v0.1.0) or by hand.
# Regular CI keeps using the public test key, only this workflow sees the
# store key. See docs/releasing.md for how the secrets are set up.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Signed APK and AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Point cargo-ndk at the runner's NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "RELEASE_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Work out the version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
      - name: Build APK and AAB
        working-directory: android
        env:
          GRAPHO_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          GRAPHO_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          GRAPHO_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          GRAPHO_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon lintRelease assembleRelease bundleRelease
          -PversionName="$VERSION_NAME" -PversionCode="$GITHUB_RUN_NUMBER"
      - name: Check the APK is not signed with the test key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$apksigner" verify --print-certs android/app/build/outputs/apk/release/*.apk | tee certs.txt
          if keytool -list -keystore android/test.keystore -storepass grapho-spike 2>/dev/null \
              | grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}' | head -1 \
              | tr -d ':' | tr 'A-F' 'a-f' | xargs -I{} grep -qi {} certs.txt; then
            echo "Release APK is signed with the test key"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: grapho-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: Attach to the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
