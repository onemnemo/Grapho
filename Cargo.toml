[workspace]
resolver = "2"
members = ["core", "ffi-android"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/onemnemo/grapho"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = true
codegen-units = 1
